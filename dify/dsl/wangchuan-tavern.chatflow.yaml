        targetType: if-else
      id: e-parse-if
      source: llm_parse
      sourceHandle: source
      target: branch_mind
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: http-request
      id: e-if-mind
      source: branch_mind
      sourceHandle: 'true'
      target: http_mind
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: http-request
      id: e-if-act
      source: branch_mind
      sourceHandle: 'false'
      target: http_act
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: llm
      id: e-mind-llm
      source: http_mind
      sourceHandle: source
      target: llm_mind
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: llm
      id: e-act-llm
      source: http_act
      sourceHandle: source
      target: llm_narrate
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: http-request
      id: e-llm_narrate-http_facts
      source: llm_narrate
      sourceHandle: source
      target: http_facts
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: answer
      id: e-http_facts-answer_turn
      source: http_facts
      sourceHandle: source
      target: answer_turn
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: http-request
      id: e-llm_mind-http_mfacts
      source: llm_mind
      sourceHandle: source
      target: http_mfacts
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: answer
      id: e-http_mfacts-answer_mind
      source: http_mfacts
      sourceHandle: source
      target: answer_mind
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: 酒客的名字决定 seekdb 里的账本行，也决定 PowerContext 的 scope
        selected: false
        title: 开始
        type: start
        variables:
        - label: 你的名字（随便起，决定你在这家店的账本）
          max_length: 48
          options: []
          required: true
          type: text-input
          variable: guest
          default: 无名客
      height: 116
      id: start
      position:
        x: 40
        y: 320
      positionAbsolute:
        x: 40
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 把玩家一句话翻成结构化动作 JSON｜【换模型】导入后请把这个节点的模型换成你自己的（原来用 deepseek-flash）；它只做一件事：把一句话拆成 JSON 动作。
        model:
          completion_params:
            max_tokens: 256
            temperature: 0.1
          mode: chat
          name: deepseek-flash
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - role: system
          text: '你是《忘川酒馆》的动作解析器。玩家会用一句中文描述他想做的事，你把它翻成一个 JSON 对象，**只输出这个 JSON**，不要解释、不要代码块、不要多余文字。

            这段 JSON 会原样交给酒馆引擎做判定，所以字段必须准确：verb 决定发生什么，target/item 决定对谁、对什么。


            字段：

            - verb：只能取 steal（偷/摸走/顺走）、buy（买/点/来一杯）、gift（送/请/递）、tell_story（讲个故事/编一段）、threaten（威胁/拍桌/拔刀）、help（帮/端/收拾/跑腿）、apologize（道歉/认错）、read_mind（读心/看他在想什么）、ask（问/打听）、close（打烊/告辞/结账/走了）、move（去某处）、look（打量/看看）

            - target：aruo（阿箬·老板娘）/ laotao（老陶·说书人）/ xiaoman（小满·打杂）/ ""

            - item：wine_guihua / wine_shaodao / tea_zuo / dish_peanut / soup_noodle / sugar / jade_pei / letter / sword / lantern / cat / ""

            - tone：sneaky（偷偷） / loud（大声） / plain


            规则：

            1. 只按玩家的字面意思判断，不要替他补全剧情。

            2. 「读心」「看看他在想什么」→ read_mind，target 填被看的人。

            3. 一句话里既有挪步又有动作（如「去后厨替小满端碗」），verb 填动作 help，不要填 move。

            4. 完全看不出意图时 verb 填 look。


            示例

            玩家：趁她低头算账，把柜台上的玉佩塞进袖子。

            {"verb":"steal","target":"aruo","item":"jade_pei","tone":"sneaky"}

            玩家：给老陶讲一个渡口的故事

            {"verb":"tell_story","target":"laotao","item":"","tone":"plain"}

            玩家：读心，看看小满现在在想什么

            {"verb":"read_mind","target":"xiaoman","item":"","tone":"plain"}

            5. 玩家只是在寒暄、自我介绍、或问「你能做什么 / 这是什么地方 / 介绍一下你自己」时，没有具体动作，verb 一律用 ask（让人物接话），不要用 look。

            '
        - role: user
          text: 玩家：{{#sys.query#}}
        selected: false
        title: 拆动作
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: llm_parse
