      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          type: x-www-form-urlencoded
          data:
          - key: guest
            type: text
            value: '{{#start.guest#}}'
        desc: 取这一回合的事实行（成功/失败 + 状态），由引擎写、模型改不了
        headers: ''
        method: post
        params: ''
        retry_config:
          max_retries: 2
