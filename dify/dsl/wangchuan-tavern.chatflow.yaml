app:
  description: 渡口最后一盏灯，什么都记得。三个 NPC 会记住你干过的每一件事——偷玉佩、讲故事、道歉，都写进 seekdb 里带全文与向量索引的记忆表；下一局进门，账本会把你的「传说」念回来。导入后配一个对话模型即可玩（后端按 README 第 1~2 步起，或用 demo 版连现成的演示后端）。
  icon: 🏮
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 忘川酒馆
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - id: 940a5edf-bd42-4745-9e48-cfc37a7a0492
    name: TAVERN_ENGINE_URL
    value: https://presence-hierarchy-necessarily-females.trycloudflare.com
    value_type: string
    description: 本机酒馆引擎地址（scripts/00_bringup.sh 或 02b+03 之后可用）。已部署好的演示后端见 wangchuan-tavern.demo.yaml。
    selector:
    - env
    - TAVERN_ENGINE_URL
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
    opening_statement: '渡口起了雾，你推开「忘川酒馆」的门。

      柜台后是阿箬，她手边摊着一本账，连半块铜板都标着日期；靠窗的老陶正在说一段渡口旧事，醒木停在半空；后厨传来一声「哎呀」——那是小满。


      这里的规矩只有三条：

      · 一杯酒换一个秘密——第一次请他喝酒，他会说一句只在杯边说的事；

      · 酒钱不能欠——铜板不够喝不上，说「赊账」会被回绝；

      · 动手要记账——偷东西（成没成都算）或威胁人，账本记一笔，记到第三次就逐出酒馆。

      另外两件事也会发生：好感够深，他会说出守了很多年的事；风评攒够了，渡口会开始讲你的传说。


      想最快看到这几条规矩的后果，可以照这三件事做（各一两回合）：

      1. 发「请阿箬喝一壶桂花酿」→ 第一回合就会看到【阿箬的杯边话】；

      2. 发「打烊了」，再发「我又来了，还认得我吗？」→ 会看到「第二天，雾散了，你又推门进来」和【酒馆记得你】那一行账本；

      3. 最后再连发三次「拍桌子吓唬阿箬」→ 第三次看到【判定：被逐出】；之后在同一段对话里说什么都进不去，点「开启新对话」就是第二天（这一步放最后，因为它会把门关上）。


      其它随便玩，说人话就行：

      · 要一壶桂花酿，铜板放柜台上

      · 问问阿箬，柜台后头那盏灯为什么夜里不灭

      · 给老陶讲个故事

      · 去后厨，替小满把碗端出来

      · 读心，看看阿箬现在在想什么'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: e-start-parse
      source: start
      sourceHandle: source
      target: llm_parse
      targetHandle: target
      type: custom
    - data:
        isInIteration: false
        isInLoop: false
